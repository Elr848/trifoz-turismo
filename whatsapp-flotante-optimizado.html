<!-- PRECONNECT WHATSAPP (Carga más rápida) -->
<link rel="preconnect" href="https://wa.me">
<link rel="dns-prefetch" href="//wa.me">

<style>
/* ==========================================================================
   AJUSTE 1: GPU ACCELERATION + WILL-CHANGE (Rendimiento máximo)
   ========================================================================== */
.whatsapp-flotante {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #25d366;
    color: white;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
    z-index: 9999;
    
    /* Optimización GPU: Transform en lugar de top/bottom/left/right */
    opacity: 0;
    visibility: hidden;
    transform: translateY(30px) translateZ(0);
    
    /* Will-change solo durante la transición (evita memory overhead) */
    transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    
    /* Evitar parpadeos: contenedor en su propia capa de composición */
    backface-visibility: hidden;
    perspective: 1000px;
}

/* Clase que activa con IntersectionObserver (AJUSTE 2) */
.whatsapp-flotante.mostrar {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) translateZ(0);
    will-change: auto; /* Desactiva after animation ends */
}

/* Hover: Solo aplicar will-change cuando es necesario */
.whatsapp-flotante:hover {
    will-change: transform, box-shadow;
    box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.4);
}

.whatsapp-flotante:hover.mostrar {
    transform: translateY(-5px) scale(1.08) translateZ(0);
}

/* AJUSTE 3: Media queries optimizadas para todos los devices */
/* Mobile - Optimizado para bajo rendimiento */
@media (max-width: 480px) {
    .whatsapp-flotante {
        bottom: 15px;
        right: 15px;
        width: 50px;
        height: 50px;
    }
    
    .whatsapp-flotante svg {
        width: 28px;
        height: 28px;
    }
}

/* Tablet */
@media (min-width: 481px) and (max-width: 1023px) {
    .whatsapp-flotante {
        bottom: 25px;
        right: 25px;
        width: 56px;
        height: 56px;
    }
}

/* Desktop - Escritorio */
@media (min-width: 1024px) {
    .whatsapp-flotante {
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        transition: opacity 0.25s ease, visibility 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .whatsapp-flotante svg {
        width: 32px;
        height: 32px;
    }
}

/* Reducir motion para usuarios que lo prefieren (accesibilidad) */
@media (prefers-reduced-motion: reduce) {
    .whatsapp-flotante,
    .whatsapp-flotante:hover {
        transition: none !important;
    }
    
    .whatsapp-flotante:hover.mostrar {
        transform: translateZ(0);
    }
}
</style>

<script>
// ==========================================================================
// AJUSTE 2: INTERSECTION OBSERVER (Reemplaza scroll event - 10x más eficiente)
// ==========================================================================
(function() {
    const botonFlotante = document.querySelector('[data-wa-button]');
    
    if (!botonFlotante) return;
    
    // Crear elemento sentinel invisible (trigger point)
    const sentinel = document.createElement('div');
    sentinel.setAttribute('data-wa-sentinel', '');
    sentinel.style.cssText = 'height: 1px; pointer-events: none;';
    
    // Insertar sentinel después de la sección principal (aprox. 250px)
    const hero = document.querySelector('.hero') || document.body;
    hero.parentNode.insertBefore(sentinel, hero.nextSibling);
    
    // IntersectionObserver: Mucho más eficiente que scroll events
    const observer = new IntersectionObserver(
        (entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) {
                    // Usuario pasó el punto trigger - mostrar botón
                    botonFlotante.classList.add('mostrar');
                } else {
                    // Usuario está en la sección principal - ocultar botón
                    botonFlotante.classList.remove('mostrar');
                }
            });
        },
        {
            rootMargin: '0px',
            threshold: 0 // Se activa cuando el elemento sale de la vista
        }
    );
    
    observer.observe(sentinel);
    
    // Limpieza: opcional, pero buena práctica
    window.addEventListener('beforeunload', () => {
        observer.disconnect();
    });
})();

// ==========================================================================
// OPTIMIZACIÓN: Prefetch WhatsApp en background (idle time)
// ==========================================================================
if ('requestIdleCallback' in window) {
    requestIdleCallback(() => {
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'https://wa.me/5545933003337';
        document.head.appendChild(link);
    });
}

// Analytics sin bloquear (opcional)
document.querySelector('[data-wa-button]')?.addEventListener('click', function() {
    if (window.gtag) {
        gtag('event', 'click_whatsapp');
    }
}, { passive: true });
</script>
